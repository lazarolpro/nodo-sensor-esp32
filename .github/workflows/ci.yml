name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Simulador local (sin hardware)
        run: python sim/sensor_sim.py --sweep
      - name: Firmware y diagrama presentes
        run: test -f firmware/main.ino && test -f wokwi/diagram.json
